[project]
name = "glueforward"
version = "3.0.0"
description = "Update listening ports to match gluetun's forwarded port on the VPN side"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
]

[project.scripts]
glueforward = "glueforward.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
