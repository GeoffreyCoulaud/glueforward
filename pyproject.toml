[project]
name = "glueforward"
version = "3.0.0"
description = "Update listening ports to match gluetun's forwarded port on the VPN side"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
]

[project.scripts]
glueforward = "glueforward.main.main:main"

# Dev tools (tests + linters). The `dev` group is installed by default by
# `uv sync`, so it is excluded from the Docker image via `--no-dev`.
[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "pylint>=3.3",
    "pyright>=1.1",
    "testcontainers>=4.15.0",
]

[tool.pytest.ini_options]
testpaths = ["glueforward/tests/unit"]
addopts = "--cov=glueforward.main --cov-branch --cov-report=term-missing --cov-fail-under=100"

# Keep the tests subpackage out of built wheels/sdists.
[tool.hatch.build]
exclude = ["glueforward/tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
