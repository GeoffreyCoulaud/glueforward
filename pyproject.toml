[project]
name = "glueforward"
version = "3.0.0"
description = "Update listening ports to match gluetun's forwarded port on the VPN side"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
]

[project.scripts]
glueforward = "glueforward.main.main:main"

# Dev tools (tests + linters). The `dev` group is installed by default by
# `uv sync`, so it is excluded from the Docker image via `--no-dev`.
[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-cov>=7",
    "pylint>=4",
    "pyright>=1.1",
    "testcontainers>=4.15.0",
    # Imported directly by the end-to-end conftest, so declared rather than
    # relied on as a transitive dependency of testcontainers.
    "python-dotenv>=1",
    "pytest-xdist>=3.8.0",
    "filelock>=3.32.2",
]

[tool.coverage.report]
exclude_also = [
    # A branch a type checker proves unreachable, and no test can therefore
    # reach either. Pyright rejects the call as soon as one becomes possible.
    'assert_never\(',
]

[tool.pytest.ini_options]
testpaths = ["glueforward/tests/unit"]
addopts = "--cov=glueforward.main --cov-branch --cov-report=term-missing --cov-fail-under=100"
markers = [
    "vpn: end-to-end test needing a real ProtonVPN connection, and its WireGuard key",
]

# Keep the tests subpackage out of built wheels/sdists.
[tool.hatch.build]
exclude = ["glueforward/tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
