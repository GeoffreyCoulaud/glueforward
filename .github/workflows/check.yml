name: Run checks

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to check out. Defaults to whatever triggered the calling workflow."
        type: string
        default: ""
      cache-write:
        description: "Whether this run may populate the shared uv cache. Trusted callers only."
        type: boolean
        default: false

jobs:

  # Lints the workflows from the pull request's head, unlike this file itself.
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Run actionlint
        uses: docker://rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 # 1.7.7

  pylint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          save-cache: ${{ inputs.cache-write }}
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run pylint on the application
        run: uv run pylint glueforward/main
      # Separate run: linted together, the tests raise an unsuppressable invalid-name.
      - name: Run pylint on the tests
        run: uv run pylint glueforward/tests

  pyright:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          save-cache: ${{ inputs.cache-write }}
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run pyright
        run: uv run pyright glueforward

  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          save-cache: ${{ inputs.cache-write }}
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run tests
        run: uv run pytest
