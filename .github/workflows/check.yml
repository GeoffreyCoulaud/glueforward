name: Run checks

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to check out. Defaults to whatever triggered the calling workflow."
        type: string
        default: ""
      cache-write:
        description: "Whether this run may populate the shared uv cache. Trusted callers only."
        type: boolean
        default: false

jobs:

  pylint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          save-cache: ${{ inputs.cache-write }}
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run pylint on the application
        run: uv run pylint glueforward/main
      # Deliberately a separate run: the unit tests assign name-mangled
      # attributes, and pylint judges those names in the scope of the class
      # that owns them, over in glueforward/main, so no annotation written in
      # a test file can suppress the resulting invalid-name.
      - name: Run pylint on the tests
        run: uv run pylint glueforward/tests

  pyright:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          save-cache: ${{ inputs.cache-write }}
      - name: Install dependencies
        run: uv sync --frozen
      # Covers the tests too, which need no separate run: pyright walks plain
      # directories and reports each file on its own terms.
      - name: Run pyright
        run: uv run pyright glueforward

  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          save-cache: ${{ inputs.cache-write }}
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run tests
        run: uv run pytest
