name: Run checks

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to check out. Defaults to whatever triggered the calling workflow."
        type: string
        default: ""
      cache-write:
        description: "Whether this run may populate the shared uv cache. Trusted callers only."
        type: boolean
        default: false

jobs:

  # Lints the workflows from the pull request's head, unlike this file itself.
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          allow-unsafe-pr-checkout: true
      - name: Run actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12

  pylint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          allow-unsafe-pr-checkout: true
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          save-cache: ${{ inputs.cache-write }}
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run pylint
        run: uv run pylint glueforward

  pyright:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          allow-unsafe-pr-checkout: true
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          save-cache: ${{ inputs.cache-write }}
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run pyright
        run: uv run pyright glueforward

  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          allow-unsafe-pr-checkout: true
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          save-cache: ${{ inputs.cache-write }}
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run tests
        run: uv run pytest
